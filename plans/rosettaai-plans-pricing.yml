notes: >-
  Rosetta.ai prices the SaaS product, not an API. There is no developer/API plan,
  no per-call price list and no free developer tier — the "Try for Free" CTA on
  Essential leads to dashboard registration for the merchant product. The metered
  unit is impressions/page views served by the on-site tag, and overage is billed
  per 1,000 requests, which is the closest thing Rosetta.ai publishes to a usage
  contract.
