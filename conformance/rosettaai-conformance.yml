  source: https://rosetta.ai/privacy
  certification: none
- id: ccpa
  conforms: claimed
  evidence: >-
    Privacy policy carries a California-residents supplement: "This privacy notice
    section for California residents supplements the information contained in Our
    Privacy Policy and it applies solely to all visitors, users, and others who
    reside in the State of California."
  source: https://rosetta.ai/privacy
  certification: none
- id: pci-dss
  conforms: false
