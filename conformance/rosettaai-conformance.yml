notes: >-
  Rosetta.ai publishes NO named security or privacy CERTIFICATION — no SOC 2, no
  ISO 27001, no PCI DSS attestation of its own, no HIPAA, no FedRAMP — and there is
  no trust centre (trust.rosetta.ai does not resolve) and no compliance page. What
  it does publish are regulatory-posture statements inside its privacy policy. Those
  are recorded below as claims with evidence, and NO `Compliance` pointer is emitted
  in apis.yml: a GDPR/CCPA section in a privacy policy is a statutory obligation
  every site carries, not a published compliance programme, and treating it as one
  would credit Rosetta.ai with an assurance posture it has not asserted.
standards: []
regulatory:
