official_sdk_count: 0
notes: >-
  NO `SDKs` POINTER IS EMITTED. Rosetta.ai publishes no installable, first-party
  client library on any package registry in any language. What it does publish is a
  CDN-distributed on-site tag and four platform plugin builds — real first-party
  code, loaded by real merchants, but a tag is not an SDK and none of it is
  versioned, pinned, released or fetchable through a package manager. The one repo
  that calls itself an SDK is empty. Emitting `SDKs` here would credit Rosetta.ai
  with a developer distribution channel it does not have.
