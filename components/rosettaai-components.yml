summary: >-
  Rosetta.ai's entire delivered surface is client-side components. There is no
  developer API product; what merchants install is a tag that renders on-site
  widgets configured from the dashboard. That makes `components` the single most
  accurate artifact type for this company, and it is captured here.
loaders:
- name: rosetta.min.js
  url: https://cdn.rosetta.ai/rosetta.min.js
  version: 2.0.0
  install: Google Tag Manager custom HTML tag (or direct script tag)
  status: live
  note: >-
    The production loader. Calls https://api.rosetta.ai/ with a Bearer token and a
    vendor media type; see authentication/ and conventions/.
- name: rosetta-web.js
  url: https://cdn.rosetta.ai/rosetta-web.js
  version: null
  status: stale
  note: >-
    Newer-generation loader on the same CDN whose API base, v4-api.rosetta.ai, does
    not resolve. Not usable.
- name: online-shop-components.css
  url: https://cdn.rosetta.ai/plugins/all/css/online-shop-components.css
  status: live
  note: Compiled stylesheet for the component families below.
