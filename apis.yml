aid: rosettaai
name: Rosetta.ai
description: >-
  Rosetta.ai is a Taipei-based e-commerce personalization and marketing
  automation platform that uses AI, image recognition, and deep learning to
  tailor the online shopping experience for every visitor. Its product suite
  spans Rosetta Engage (AI product recommenders), Rosetta AdMatch (personalized
  advertising and traffic acquisition), Rosetta Analytics (machine-learning
  consumer and product insight), and Rosetta Automation (multi-channel EDM, SMS,
  and LINE marketing). The platform is delivered as a hosted SaaS dashboard and
  as a Shopify app ("Personalization Upsell Dealer"), integrating with
  storefronts through Google Tag Manager and product-feed connections rather
  than a public developer REST API. A first-party REST API does run at
  api.rosetta.ai — the production tag authenticates to it with a Bearer token and
  an application/vnd.rosetta-ai.v2+json media type — but Rosetta.ai publishes no
  reference, no specification and no developer program for it, so it is an
  internal contract rather than a product. This profile was surfaced as a 500
  Global portfolio company and enriched from Rosetta.ai's public marketing site,
  GitBook help center, CDN distribution, and GitHub organization.
